{% load static %}
<header class="site-header">
  <a class="brand" href="{% url 'pages:home' %}" aria-label="Avsar home">
    <img src="{% static 'pages/avsar-logo.png' %}" alt="">
    <span>Avsar</span>
  </a>
  <nav class="site-nav" aria-label="Main navigation">
    <details class="nav-dropdown">
      <summary class="nav-link">Explore <span aria-hidden="true">⌄</span></summary>
      <div class="nav-dropdown-menu">
        <a href="{% url 'pages:opportunities' %}">All opportunities</a>
        <a href="{% url 'pages:schemes' %}">Government schemes</a>
        <a href="{% url 'pages:scholarships' %}">Scholarships</a>
        <a href="{% url 'pages:internships' %}">Internships</a>
      </div>
    </details>
    <a class="nav-link" href="{% url 'pages:home' %}#how-it-works">How it works</a>
    {% if user.is_authenticated %}
      <a class="nav-account" href="{% url 'pages:profile' %}">My account</a>
      <form class="nav-logout" method="post" action="{% url 'pages:logout' %}">
        {% csrf_token %}
        <button type="submit">Log out</button>
      </form>
    {% else %}
      <a class="nav-link" href="{% url 'pages:login' %}">Log in</a>
      <a class="nav-account" href="{% url 'pages:register' %}">Sign up</a>
    {% endif %}
  </nav>
</header>
